name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run all test phases
        run: ./test-all.sh
      - name: Build and install smoke test
        run: ./install.sh --smoke-test

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app
        run: ./build.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          # A plain directory path makes the uploader include the bundle's
          # contents and strips the "Display Steward.app" wrapper; the
          # wildcard preserves the matched directory name at the artifact root.
          name: Display-Steward-app
          path: build/*.app
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download built app
        uses: actions/download-artifact@v8
        with:
          name: Display-Steward-app
          path: staging
      - name: Set version from tag and re-sign
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="staging/Display Steward.app"
          test -d "$APP/Contents" || {
            echo "Expected app bundle at '$APP'; downloaded artifact tree:"
            find staging -maxdepth 3
            exit 1
          }
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Display-Steward-$VERSION.zip"
          DMG_STAGE=$(mktemp -d "${TMPDIR:-/tmp}/display-steward-dmg.XXXXXX")
          cp -R "$APP" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create -volname "Display Steward" -srcfolder "$DMG_STAGE" -ov -format UDZO "Display-Steward-$VERSION.dmg"
          rm -rf "$DMG_STAGE"
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            Display-Steward-*.zip
            Display-Steward-*.dmg
          generate_release_notes: true
